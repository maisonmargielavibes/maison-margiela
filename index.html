<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAISON MARGIELA | 3D VIRTUAL FITTING</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: #f0ebe6;
            color: #1a1a1a;
            overflow: hidden;
            height: 100vh;
        }

        header {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 25px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            background: rgba(240, 235, 230, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #d8d0c8;
        }

        .logo {
            font-size: 1.1rem;
            letter-spacing: 10px;
            font-weight: 300;
            color: #1a1a1a;
            position: relative;
        }

        .logo::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 2px;
            background: repeating-linear-gradient(
                90deg,
                transparent,
                transparent 5px,
                #fff 5px,
                #fff 10px,
                transparent 10px,
                transparent 15px
            );
        }

        nav a {
            color: #1a1a1a;
            text-decoration: none;
            margin-left: 35px;
            font-size: 0.7rem;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .main-container {
            display: flex;
            height: 100vh;
            padding-top: 80px;
        }

        #canvas-container {
            flex: 1;
            position: relative;
            background: linear-gradient(180deg, #f0ebe6 0%, #e8e0d8 100%);
        }

        .product-panel {
            width: 400px;
            background: #f5f0eb;
            border-left: 1px solid #d8d0c8;
            overflow-y: auto;
        }

        .category-tabs {
            display: flex;
            position: sticky;
            top: 0;
            background: #f5f0eb;
            z-index: 50;
            border-bottom: 1px solid #d8d0c8;
        }

        .tab-btn {
            flex: 1;
            padding: 20px;
            background: transparent;
            border: none;
            color: #888;
            font-size: 0.65rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }

        .tab-btn.active {
            color: #1a1a1a;
            border-bottom-color: #1a1a1a;
        }

        .product-grid {
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .product-card {
            background: #fff;
            border: 1px solid #e8e0d8;
            padding: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .product-card:hover {
            border-color: #1a1a1a;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        .product-card.active {
            border-color: #1a1a1a;
            background: #ebe6e1;
        }

        .product-image {
            width: 100%;
            height: 180px;
            background: #f8f5f2;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
            overflow: hidden;
        }

        .product-image img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .product-name {
            font-size: 0.7rem;
            letter-spacing: 1.5px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .product-price {
            font-size: 0.75rem;
            color: #666;
        }

        .controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 100;
            background: rgba(245, 240, 235, 0.95);
            padding: 12px 20px;
            border-radius: 25px;
            border: 1px solid #d8d0c8;
        }

        .ctrl-btn {
            padding: 8px 18px;
            background: transparent;
            border: 1px solid #c8c0b8;
            color: #1a1a1a;
            font-size: 0.65rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
        }

        .ctrl-btn:hover {
            background: #1a1a1a;
            color: #fff;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">MAISON MARGIELA</div>
        <nav>
            <a href="#">WOMEN</a>
            <a href="#">MEN</a>
            <a href="#">ARTISANAL</a>
        </nav>
    </header>

    <div class="main-container">
        <div id="canvas-container"></div>

        <div class="product-panel">
            <div class="category-tabs">
                <button class="tab-btn active" onclick="showCategory('tops')">TOPS</button>
                <button class="tab-btn" onclick="showCategory('bottoms')">BOTTOMS</button>
                <button class="tab-btn" onclick="showCategory('shoes')">SHOES</button>
                <button class="tab-btn" onclick="showCategory('bags')">BAGS</button>
            </div>

            <div class="product-grid" id="tops">
                <div class="product-card" onclick="wearItem('blazer-black')">
                    <div class="product-image">
                        <img src="https://www.maisonmargiela.com/dw/image/v2/BBHDVLZP_PRD/on/demandware.static/-/Sites-maisonmargiela-master/default/dw8b5c5a5e/images/large/S58CT0632P4086T8013.jpg" alt="Blazer" onerror="this.src='https://images.unsplash.com/photo-1591047139829-d91aecb6caea?w=300'">
                    </div>
                    <div class="product-name">DECONSTRUCTED BLAZER</div>
                    <div class="product-price">€2,890</div>
                </div>
                <div class="product-card" onclick="wearItem('sweater-beige')">
                    <div class="product-image">
                        <img src="https://www.maisonmargiela.com/dw/image/v2/BBHDVLZP_PRD/on/demandware.static/-/Sites-maisonmargiela-master/default/dw123456789/images/large/S59CT0167P4300T8013.jpg" alt="Sweater" onerror="this.src='https://images.unsplash.com/photo-1576566588028-4147f3842f27?w=300'">
                    </div>
                    <div class="product-name">OVERSIZED SWEATER</div>
                    <div class="product-price">€890</div>
                </div>
                <div class="product-card" onclick="wearItem('coat-camel')">
                    <div class="product-image">
                        <img src="https://www.maisonmargiela.com/dw/image/v2/BBHDVLZP_PRD/on/demandware.static/-/Sites-maisonmargiela-master/default/dw987654321/images/large/S51CT0123P4300T8013.jpg" alt="Coat" onerror="this.src='https://images.unsplash.com/photo-1539533018447-63fcce2678e3?w=300'">
                    </div>
                    <div class="product-name">WOOL COAT</div>
                    <div class="product-price">€3,290</div>
                </div>
            </div>

            <div class="product-grid" id="bottoms" style="display:none">
                <div class="product-card" onclick="wearItem('trousers-black')">
                    <div class="product-image">
                        <img src="https://www.maisonmargiela.com/dw/image/v2/BBHDVLZP_PRD/on/demandware.static/-/Sites-maisonmargiela-master/default/dw111222333/images/large/S51KA0046P4300T8013.jpg" alt="Trousers" onerror="this.src='https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?w=300'">
                    </div>
                    <div class="product-name">WIDE TROUSERS</div>
                    <div class="product-price">€780</div>
                </div>
                <div class="product-card" onclick="wearItem('jeans-blue')">
                    <div class="product-image">
                        <img src="https://www.maisonmargiela.com/dw/image/v2/BBHDVLZP_PRD/on/demandware.static/-/Sites-maisonmargiela-master/default/dw444555666/images/large/S51LA0023P4300T8013.jpg" alt="Jeans" onerror="this.src='https://images.unsplash.com/photo-1541099649105-f69ad21f3246?w=300'">
                    </div>
                    <div class="product-name">REPLICA JEANS</div>
                    <div class="product-price">€590</div>
                </div>
            </div>

            <div class="product-grid" id="shoes" style="display:none">
                <div class="product-card" onclick="wearItem('tabi-black')">
                    <div class="product-image">
                        <img src="https://www.maisonmargiela.com/dw/image/v2/BBHDVLZP_PRD/on/demandware.static/-/Sites-maisonmargiela-master/default/dw777888999/images/large/S58WU0260P3753T8013.jpg" alt="Tabi" onerror="this.src='https://images.unsplash.com/photo-1608231387042-66d1773070a5?w=300'">
                    </div>
                    <div class="product-name">TABI BOOTS</div>
                    <div class="product-price">€1,290</div>
                </div>
                <div class="product-card" onclick="wearItem('replica-white')">
                    <div class="product-image">
                        <img src="https://www.maisonmargiela.com/dw/image/v2/BBHDVLZP_PRD/on/demandware.static/-/Sites-maisonmargiela-master/default/dw000111222/images/large/S57WS0236P1895101.jpg" alt="Replica" onerror="this.src='https://images.unsplash.com/photo-1549298916-b41d501d3772?w=300'">
                    </div>
                    <div class="product-name">REPLICA SNEAKERS</div>
                    <div class="product-price">€850</div>
                </div>
            </div>

            <div class="product-grid" id="bags" style="display:none">
                <div class="product-card" onclick="wearItem('bag-5ac')">
                    <div class="product-image">
                        <img src="https://www.maisonmargiela.com/dw/image/v2/BBHDVLZP_PRD/on/demandware.static/-/Sites-maisonmargiela-master/default/dw333444555/images/large/SB1WG0086P8838T8013.jpg" alt="5AC Bag" onerror="this.src='https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=300'">
                    </div>
                    <div class="product-name">5AC BAG</div>
                    <div class="product-price">€2,150</div>
                </div>
                <div class="product-card" onclick="wearItem('bag-glamslam')">
                    <div class="product-image">
                        <img src="https://www.maisonmargiela.com/dw/image/v2/BBHDVLZP_PRD/on/demandware.static/-/Sites-maisonmargiela-master/default/dw666777888/images/large/SB1WG0019P4300T8013.jpg" alt="Glam Slam" onerror="this.src='https://images.unsplash.com/photo-1548036328-c9fa89d128fa?w=300'">
                    </div>
                    <div class="product-name">GLAM SLAM</div>
                    <div class="product-price">€1,890</div>
                </div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="ctrl-btn" onclick="clearAll()">CLEAR</button>
        <button class="ctrl-btn" onclick="toggleRotate()">ROTATE</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf0ebe6);
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.5, 5);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.getElementById('canvas-container').appendChild(renderer.domElement);
        
        // Controls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 1, 0);
        controls.enableDamping = true;
        
        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 5);
        dirLight.castShadow = true;
        scene.add(dirLight);
        
        // Human body materials
        const skinMaterial = new THREE.MeshStandardMaterial({ 
            color: 0xe8ddd4,
            roughness: 0.7
        });
        
        // Create 3D Human Figure
        const human = new THREE.Group();
        
        // Torso
        const torso = new THREE.Mesh(
            new THREE.CylinderGeometry(0.25, 0.20, 0.7, 32),
            skinMaterial
        );
        torso.position.y = 1.15;
        torso.castShadow = true;
        human.add(torso);
        
        // Head
        const head = new THREE.Mesh(
            new THREE.SphereGeometry(0.14, 32, 32),
            skinMaterial
        );
        head.position.y = 1.75;
        head.castShadow = true;
        human.add(head);
        
        // Neck
        const neck = new THREE.Mesh(
            new THREE.CylinderGeometry(0.08, 0.10, 0.15, 32),
            skinMaterial
        );
        neck.position.y = 1.55;
        human.add(neck);
        
        // Arms
        function createArm(xPos) {
            const arm = new THREE.Mesh(
                new THREE.CylinderGeometry(0.07, 0.06, 0.65, 32),
                skinMaterial
            );
            arm.position.set(xPos, 1.2, 0);
            arm.castShadow = true;
            return arm;
        }
        
        const leftArm = createArm(-0.32);
        const rightArm = createArm(0.32);
        human.add(leftArm);
        human.add(rightArm);
        
        // Legs
        function createLeg(xPos) {
            const leg = new THREE.Group();
            
            const thigh = new THREE.Mesh(
                new THREE.CylinderGeometry(0.11, 0.09, 0.45, 32),
                skinMaterial
            );
            thigh.position.y = 0.65;
            thigh.castShadow = true;
            leg.add(thigh);
            
            const calf = new THREE.Mesh(
                new THREE.CylinderGeometry(0.08, 0.07, 0.45, 32),
                skinMaterial
            );
            calf.position.y = -0.25;
            calf.castShadow = true;
            leg.add(calf);
            
            const foot = new THREE.Mesh(
                new THREE.BoxGeometry(0.10, 0.06, 0.22),
                skinMaterial
            );
            foot.position.set(0, -0.52, 0.08);
            foot.castShadow = true;
            leg.add(foot);
            
            leg.position.set(xPos, 0.45, 0);
            return leg;
        }
        
        const leftLeg = createLeg(-0.12);
        const rightLeg = createLeg(0.12);
        human.add(leftLeg);
        human.add(rightLeg);
        
        scene.add(human);
        
        // Floor
        const floor = new THREE.Mesh(
            new THREE.CircleGeometry(4, 64),
            new THREE.MeshStandardMaterial({ color: 0xd8d0c8 })
        );
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);
        
        // Clothing system
        const clothingGroup = new THREE.Group();
        human.add(clothingGroup);
        const wornClothes = {};
        
        // Wear item function
        function wearItem(itemId) {
            // Remove existing clothes in same category
            if (wornClothes[itemId]) {
                clothingGroup.remove(wornClothes[itemId]);
                delete wornClothes[itemId];
                return;
            }
            
            let clothing;
            
            if (itemId === 'blazer-black') {
                clothing = createBlazer(0x1a1a1a);
            } else if (itemId === 'sweater-beige') {
                clothing = createSweater(0xc4b5a0);
            } else if (itemId === 'coat-camel') {
                clothing = createCoat(0x8b7355);
            } else if (itemId === 'trousers-black') {
                clothing = createTrousers(0x1a1a1a);
            } else if (itemId === 'jeans-blue') {
                clothing = createTrousers(0x4a5a7a);
            } else if (itemId === 'tabi-black') {
                clothing = createTabiBoots(0x0a0a0a);
            } else if (itemId === 'replica-white') {
                clothing = createSneakers(0xf5f0eb);
            } else if (itemId === 'bag-5ac') {
                clothing = createBag(0x1a1a1a);
            } else if (itemId === 'bag-glamslam') {
                clothing = createBag(0x2a1f1a);
            }
            
            if (clothing) {
                clothingGroup.add(clothing);
                wornClothes[itemId] = clothing;
            }
        }
        
        function createBlazer(color) {
            const group = new THREE.Group();
            const material = new THREE.MeshStandardMaterial({ color: color });
            
            // Body
            const body = new THREE.Mesh(
                new THREE.CylinderGeometry(0.30, 0.26, 0.75, 32),
                material
            );
            body.position.y = 1.15;
            body.castShadow = true;
            group.add(body);
            
            // Sleeves
            const sleeveGeo = new THREE.CylinderGeometry(0.09, 0.07, 0.60, 32);
            const leftSleeve = new THREE.Mesh(sleeveGeo, material);
            leftSleeve.position.set(-0.35, 1.20, 0);
            leftSleeve.rotation.z = 0.1;
            leftSleeve.castShadow = true;
            group.add(leftSleeve);
            
            const rightSleeve = new THREE.Mesh(sleeveGeo, material);
            rightSleeve.position.set(0.35, 1.20, 0);
            rightSleeve.rotation.z = -0.1;
            rightSleeve.castShadow = true;
            group.add(rightSleeve);
            
            return group;
        }
        
        function createSweater(color) {
            const material = new THREE.MeshStandardMaterial({ color: color });
            const sweater = new THREE.Mesh(
                new THREE.CylinderGeometry(0.28, 0.24, 0.70, 32),
                material
            );
            sweater.position.y = 1.15;
            sweater.castShadow = true;
            return sweater;
        }
        
        function createCoat(color) {
            const group = new THREE.Group();
            const material = new THREE.MeshStandardMaterial({ color: color });
            
            const coat = new THREE.Mesh(
                new THREE.CylinderGeometry(0.35, 0.32, 1.0, 32),
                material
            );
            coat.position.y = 1.10;
            coat.castShadow = true;
            group.add(coat);
            
            return group;
        }
        
        function createTrousers(color) {
            const group = new THREE.Group();
            const material = new THREE.MeshStandardMaterial({ color: color });
            
            // Waist
            const waist = new THREE.Mesh(
                new THREE.CylinderGeometry(0.24, 0.22, 0.20, 32),
                material
            );
            waist.position.y = 0.85;
            waist.castShadow = true;
            group.add(waist);
            
            // Legs
            const legGeo = new THREE.CylinderGeometry(0.12, 0.10, 0.90, 32);
            const leftLeg = new THREE.Mesh(legGeo, material);
            leftLeg.position.set(-0.12, 0.40, 0);
            leftLeg.castShadow = true;
            group.add(leftLeg);
            
            const rightLeg = new THREE.Mesh(legGeo, material);
            rightLeg.position.set(0.12, 0.40, 0);
            rightLeg.castShadow = true;
            group.add(rightLeg);
            
            return group;
        }
        
        function createTabiBoots(color) {
            const group = new THREE.Group();
            const material = new THREE.MeshStandardMaterial({ color: color });
            
            function createTabiBoot(xPos) {
                const boot = new THREE.Group();
                
                const bootBody = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.08, 0.09, 0.18, 32),
                    material
                );
                bootBody.position.y = 0.09;
                bootBody.castShadow = true;
                boot.add(bootBody);
                
                // Split toe
                const bigToe = new THREE.Mesh(
                    new THREE.SphereGeometry(0.045, 32, 32),
                    material
                );
                bigToe.position.set(xPos > 0 ? 0.025 : -0.025, 0.02, 0.08);
                bigToe.scale.set(1, 0.7, 1.3);
                bigToe.castShadow = true;
                boot.add(bigToe);
                
                const otherToes = new THREE.Mesh(
                    new THREE.SphereGeometry(0.05, 32, 32),
                    material
                );
                otherToes.position.set(xPos > 0 ? -0.025 : 0.025, 0.02, 0.07);
                otherToes.scale.set(1.2, 0.65, 1.1);
                otherToes.castShadow = true;
                boot.add(otherToes);
                
                boot.position.set(xPos, -0.50, 0.08);
                return boot;
            }
            
            group.add(createTabiBoot(-0.12));
            group.add(createTabiBoot(0.12));
            
            return group;
        }
        
        function createSneakers(color) {
            const group = new THREE.Group();
            const material = new THREE.MeshStandardMaterial({ color: color });
            const soleMaterial = new THREE.MeshStandardMaterial({ color: 0xc4a574 });
            
            function createSneaker(xPos) {
                const sneaker = new THREE.Group();
                
                const body = new THREE.Mesh(
                    new THREE.BoxGeometry(0.12, 0.07, 0.24),
                    material
                );
                body.position.y = 0.035;
                body.castShadow = true;
                sneaker.add(body);
                
                const sole = new THREE.Mesh(
                    new THREE.BoxGeometry(0.13, 0.025, 0.25),
                    soleMaterial
                );
                sole.position.y = -0.015;
                sole.castShadow = true;
                sneaker.add(sole);
                
                sneaker.position.set(xPos, -0.50, 0.08);
                return sneaker;
            }
            
            group.add(createSneaker(-0.12));
            group.add(createSneaker(0.12));
            
            return group;
        }
        
        function createBag(color) {
            const material = new THREE.MeshStandardMaterial({ color: color });
            const bag = new THREE.Mesh(
                new THREE.BoxGeometry(0.22, 0.18, 0.10),
                material
            );
            bag.position.set(-0.38, 0.65, 0.15);
            bag.rotation.z = 0.2;
            bag.castShadow = true;
            return bag;
        }
        
        function clearAll() {
            Object.keys(wornClothes).forEach(key => {
                clothingGroup.remove(wornClothes[key]);
            });
            Object.keys(wornClothes).forEach(key => delete wornClothes[key]);
        }
        
        let rotating = false;
        function toggleRotate() {
            rotating = !rotating;
            controls.autoRotate = rotating;
        }
        
        function showCategory(cat) {
            document.querySelectorAll('.product-grid').forEach(g => g.style.display = 'none');
            document.getElementById(cat).style.display = 'grid';
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
        }
        
        // Animation
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        
        animate();
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
